services:
  postgres:
    image: postgres:16-alpine
    container_name: eval-postgres
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: auditdb
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d auditdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: eval-rabbitmq
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  auditoria-api:
    build: .
    container_name: eval-auditoria-api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports: ["8080:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Auditoria: "Host=postgres;Port=5432;Database=auditdb;Username=audit;Password=audit"
      Database__MigrarAlIniciar: "true"
      Jwt__Issuer: "https://sts.windows.net/eval-tenant/"
      Jwt__Audience: "api://corefid-audit"
      Jwt__SymmetricKey: "${JWT_DEV_SECRET:-eval-secret-please-change-me-0123456789abcdef}"
      Jwt__RequireHttpsMetadata: "false"
      RabbitMq__Habilitado: "true"
      RabbitMq__Host: rabbitmq
      RabbitMq__Usuario: guest
      RabbitMq__Password: guest
      Outbox__IntervaloSegundos: "5"
      Serilog__MinimumLevel__Default: Information
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
